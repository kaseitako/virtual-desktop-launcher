name: PowerShell tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download test dependency
        shell: pwsh
        run: Save-Module Pester -RequiredVersion 4.10.1 -Path ./.tools -Repository PSGallery -Force
      - name: Run tests
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1
